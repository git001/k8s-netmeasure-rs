# Overlay run: a normal pod on the source node measures overlay listen pods.
#
# Before applying, set:
#   - nodeSelector: the source node;
#   - --target: the pod IPs of the overlay listen pods on the target nodes:
#       oc -n netmeasure get pods -l app.kubernetes.io/component=listen-overlay -o wide
#   - PHASE: e.g. baseline, then after the change candidate; recorded as label
#     phase=<PHASE>. File names are unique anyway (path, node, start time, run_id).
# A Job's pod template is immutable: delete the Job before applying a changed one.
apiVersion: batch/v1
kind: Job
metadata:
  name: netmeasure-run-overlay
  namespace: netmeasure
  labels:
    app.kubernetes.io/name: k8s-netmeasure
    app.kubernetes.io/component: run-overlay
spec:
  # A measurement is never repeated automatically: a retry would hide the failure.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-netmeasure
        # Matched by networkpolicy-listen-overlay.yaml.
        app.kubernetes.io/component: run-overlay
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # ≥ --shutdown-deadline + --timeout + 10 s (defaults: 10 s + 5 s + 10 s = 25 s).
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: SOURCE-NODE
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Plain Kubernetes only, if the volume is not writable for the image's UID
        # 1001: fsGroup: 1001. OpenShift assigns a fitting fsGroup itself.
      containers:
        - name: run
          image: ghcr.io/git001/k8s-netmeasure-rs
          args:
            - run
            - --target=10.128.2.10:17700
            - --target=10.129.2.10:17700
            - --path=overlay
            - --label=phase=$(PHASE)
            - --node-context-from=$(HOST_IP):17701
            # A directory: run names the file <path>-<node>-<UTC start>-<run_id>.json,
            # so no run overwrites another.
            - --output=/results/
            # For long runs: probes on an own control port (see below).
            # - --control-port=17702
          env:
            - name: PHASE
              value: baseline
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # With --control-port=17702:
          # startupProbe:
          #   httpGet: { path: /startup, port: 17702 }
          #   periodSeconds: 2
          #   failureThreshold: 30
          #   timeoutSeconds: 2
          # livenessProbe:
          #   httpGet: { path: /live, port: 17702 }
          #   periodSeconds: 10
          #   failureThreshold: 3
          #   timeoutSeconds: 2
          # run checks the quota (= limit, here 1 CPU) and refuses less than 500m,
          # because a throttled measuring process measures itself; throttling during
          # a cycle makes it invalid (cpu_throttled). The request only reserves
          # capacity: 500m fits on busy nodes, where a full CPU is often not free.
          # If it is, requests = limits gives Guaranteed QoS.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: netmeasure-results
