# Overlay listen: one per node, a normal pod on the pod network.
#
# - It is the target of overlay measurements (pod IP:17700).
# - A pod cannot see the node's NIC, so it reads the NIC path from the underlay
#   listen on its own node: --node-context-from $(HOST_IP):17701. It refuses to
#   start (exit 3) until that node listener answers, has the same boot id and sees a
#   NIC; the pod restarts until the underlay DaemonSet is ready.
# - networkpolicy-listen-overlay.yaml limits who can reach it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netmeasure-listen-overlay
  namespace: netmeasure
  labels:
    app.kubernetes.io/name: k8s-netmeasure
    app.kubernetes.io/component: listen-overlay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-netmeasure
      app.kubernetes.io/component: listen-overlay
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-netmeasure
        app.kubernetes.io/component: listen-overlay
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listen
          image: ghcr.io/git001/k8s-netmeasure-rs
          args:
            - listen
            # $(HOST_IP) is expanded by Kubernetes from the env entry below.
            - --node-context-from=$(HOST_IP):17701
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: measured
              containerPort: 17700
              protocol: TCP
            - name: control
              containerPort: 17701
              protocol: TCP
          startupProbe:
            httpGet: { path: /startup, port: control }
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /live, port: control }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: control }
            periodSeconds: 5
            failureThreshold: 1
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
