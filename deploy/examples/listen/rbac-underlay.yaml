# Service account for every hostNetwork pod (underlay listen and underlay run).
#
# OpenShift: the Role lets this service account use the SCC `hostnetwork-v2`
# (hostNetwork and host ports, but non-root, no capabilities, no privilege
# escalation). On plain Kubernetes the Role is unused and harmless.
#
# Normal pods (overlay) use the namespace's `default` service account and keep
# restricted-v2.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netmeasure-underlay
  namespace: netmeasure
  labels:
    app.kubernetes.io/name: k8s-netmeasure
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netmeasure-scc-hostnetwork-v2
  namespace: netmeasure
  labels:
    app.kubernetes.io/name: k8s-netmeasure
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["hostnetwork-v2"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netmeasure-scc-hostnetwork-v2
  namespace: netmeasure
  labels:
    app.kubernetes.io/name: k8s-netmeasure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netmeasure-scc-hostnetwork-v2
subjects:
  - kind: ServiceAccount
    name: netmeasure-underlay
    namespace: netmeasure
