# The listen side: namespace, underlay service account, both DaemonSets, policy.
#
#   oc apply -f deploy/examples/listen/namespace.yaml
#   oc apply -k deploy/examples/listen --dry-run=server
#   oc apply -k deploy/examples/listen        (or kubectl apply -k)
#
# The namespace must exist before the server dry run: a dry run creates nothing, so
# every namespaced object would fail with "namespaces netmeasure not found".
#
# CI publishes the image as sha-<12-char commit> and, for releases, <version>; set
# one of them below, or better a digest (`digest: sha256:...` instead of newTag).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac-underlay.yaml
  - listen-underlay.yaml
  - listen-overlay.yaml
  - networkpolicy-listen-overlay.yaml
images:
  - name: ghcr.io/git001/k8s-netmeasure-rs
    newTag: SET-ME
    # Better, by digest (replace the newTag line), e.g.
    #   digest: sha256:<64 hex digits>
    # Never use a tag that starts with `sha256-`: those hold the signature, SBOM and
    # provenance attestations, not the image (the container fails to start with
    # "image not known").
