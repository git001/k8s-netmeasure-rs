# cargo-deny policy (design §1, §12). Checked by `cargo xtask deny`, which also enforces
# what cargo-deny cannot express: every `skip` entry carries "(review YYYY-MM-DD)" in its
# reason and fails after that date, and direct dependencies may never be excepted.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allowlist is the design policy (§12), not the current graph.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Transitive duplicates only, one entry per line:
# { crate = "name@version", reason = "<why> (review YYYY-MM-DD)" },
skip = [
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
