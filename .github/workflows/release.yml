# Version tags: the GitHub release with the CHANGELOG.md section of that version as
# notes plus verification instructions, and the static musl binary as an emergency
# release artifact (design §1) with checksum, SPDX SBOM, SBOM attestation and build
# provenance. The image (signature, SBOM, provenance) is handled by image.yml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/git001/k8s-netmeasure-rs

jobs:
  musl-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails early if CHANGELOG.md has no section for this version.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          identity="^https://github.com/${GITHUB_REPOSITORY}/"
          issuer="https://token.actions.githubusercontent.com"
          cargo xtask changelog "${GITHUB_REF_NAME}" > release-notes.md
          cat >> release-notes.md <<EOF

          ## Container image

          The image is the distribution format. Reference it by digest; mirror it by
          digest so signature and attestations stay valid.

          \`\`\`
          podman pull ${IMAGE}:${version}

          cosign verify \\
            --certificate-identity-regexp '${identity}' \\
            --certificate-oidc-issuer ${issuer} \\
            ${IMAGE}:${version}

          cosign verify-attestation --type spdxjson \\
            --certificate-identity-regexp '${identity}' \\
            --certificate-oidc-issuer ${issuer} \\
            ${IMAGE}:${version}

          gh attestation verify oci://${IMAGE}:${version} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## Static binary (emergency artifact only)

          \`\`\`
          sha256sum -c k8s-netmeasure-${GITHUB_REF_NAME}-x86_64-linux-musl.sha256
          gh attestation verify k8s-netmeasure-${GITHUB_REF_NAME}-x86_64-linux-musl --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-auditable@0.7.7
      - run: cargo xtask musl
      - name: Package
        run: |
          name="k8s-netmeasure-${GITHUB_REF_NAME}-x86_64-linux-musl"
          cp target/x86_64-unknown-linux-musl/release/k8s-netmeasure "${name}"
          sha256sum "${name}" > "${name}.sha256"
          echo "ASSET=${name}" >> "$GITHUB_ENV"
      - name: SPDX SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ env.ASSET }}
          format: spdx-json
          output-file: ${{ env.ASSET }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.ASSET }}.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" "${ASSET}" "${ASSET}.sha256" "${ASSET}.spdx.json" --clobber
