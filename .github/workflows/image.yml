# Container image (design §13): build, scan, and on main / version tags push to GHCR,
# then by digest: keyless cosign signature (Fulcio + Rekor, GitHub OIDC), SPDX SBOM
# (syft) as cosign attestation, and SLSA build provenance. Pull requests build and
# scan only.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/git001/k8s-netmeasure-rs

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          short_sha="${GITHUB_SHA::12}"
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "k8s-netmeasure") | .version')"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"
          docker build -f Containerfile \
            --build-arg BUILD_GIT_SHA="${short_sha}" \
            --build-arg VERSION="${version}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}:sha-${short_sha}" .
          docker run --rm "${IMAGE}:sha-${short_sha}" --version

      - name: Scan (critical findings fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Scan report (all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          exit-code: "0"
          format: table

      - name: Push
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:sha-${SHORT_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "${IMAGE}:sha-${SHORT_SHA}" "${IMAGE}:${GITHUB_REF_NAME#v}"
            docker push "${IMAGE}:${GITHUB_REF_NAME#v}"
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${SHORT_SHA}")"
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        if: github.event_name == 'push'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SPDX SBOM (syft)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM as cosign attestation
        if: github.event_name == 'push'
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom-image.spdx.json "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: sbom-image
          path: sbom-image.spdx.json
