# Weekly: newest compatible versions of every dependency, then the full gate run
# (design §1, §12). A failure opens an issue. Major versions come via Dependabot.
name: freshness

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update-and-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-llvm-cov@0.9.1
      - run: cargo update
      - run: git diff --stat Cargo.lock
      - run: cargo xtask ci
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly dependency update fails a gate ($(date -u +%F))" \
            --body "The freshness job ran \`cargo update\` and a gate failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
